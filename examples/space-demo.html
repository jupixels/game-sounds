<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Demo: Asteroid Run</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d14;color:#e8eaf2;font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;margin:0 auto;background:radial-gradient(#141a2e,#07080d);touch-action:none}
  #hud{position:fixed;top:10px;left:0;right:0;text-align:center;pointer-events:none}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center}
  #msg b{font-size:28px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"><b>Asteroid Run</b><div>Arrows / WASD move · Space shoots · grab gold coins and blue power-ups</div><div>Press any key or tap to start</div></div>
<script src="../lib/sfx.js"></script>
<script>
const sfx = new SFX({ base: "../sounds/" });
const ready = sfx.load({
  shoot:    { src: ["scifi/laser_small_01.mp3", "scifi/laser_small_02.mp3", "scifi/laser_small_03.mp3"], volume: 0.5 },
  boom:     { src: ["scifi/explosion_crunch_01.mp3", "scifi/explosion_crunch_02.mp3", "scifi/explosion_crunch_03.mp3"], volume: 0.6 },
  bigBoom:  { src: "scifi/explosion_deep_01.mp3", volume: 0.8 },
  hit:      { src: ["scifi/hull_impact_01.mp3", "scifi/hull_impact_02.mp3"], volume: 0.7 },
  coin:     { src: ["arcade/pep_01.mp3", "arcade/pep_02.mp3"], volume: 0.5 },
  powerUp:  { src: "arcade/power_up_11.mp3", volume: 0.5 },
  shield:   { src: "scifi/force_field_01.mp3", volume: 0.5 },
  engine:   { src: "scifi/engine_small_01.mp3", volume: 0.25 },
  start:    { src: "ui/confirm_01.mp3", volume: 0.6 },
  gameOver: { src: "jingles/jingle_8bit_11.mp3", volume: 0.5 },
});

const cv = document.getElementById("c"), g = cv.getContext("2d");
const hud = document.getElementById("hud"), msg = document.getElementById("msg");
let W, H; function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; } size(); addEventListener("resize", size);

const keys = {}; let state = "title", ship = {x:0,y:0,inv:0}, rocks = [], shots = [], items = [], score = 0, lives = 3, cooldown, rapid, engine = null, t0 = 0, spawn = 0;
function reset(){ ship = { x: W/2, y: H*0.8, inv: 0 }; rocks = []; shots = []; items = []; score = 0; lives = 3; cooldown = 0; rapid = 0; }
async function start(){ await ready; reset(); state = "play"; msg.style.display = "none"; sfx.play("start"); }

addEventListener("keydown", e => { keys[e.code] = true; if (state !== "play") start(); if (e.code === "Space") e.preventDefault(); });
addEventListener("keyup", e => keys[e.code] = false);
let touch = null;
cv.addEventListener("pointerdown", e => { if (state !== "play") start(); touch = e; });
cv.addEventListener("pointermove", e => { if (touch) touch = e; });
addEventListener("pointerup", () => touch = null);

function shoot(){
  shots.push({ x: ship.x, y: ship.y - 18 });
  sfx.play("shoot", { vary: 0.06, pan: (ship.x / W) * 2 - 1 });
  cooldown = rapid > 0 ? 0.09 : 0.22;
}
function explode(r){
  sfx.play(r.r > 30 ? "bigBoom" : "boom", { pan: (r.x / W) * 2 - 1, vary: 0.1, volume: r.r > 30 ? 1 : 0.8 });
  if (Math.random() < 0.35) items.push({ x: r.x, y: r.y, type: Math.random() < 0.8 ? "coin" : "power" });
}

function update(dt){
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (touch) { dx = Math.sign(touch.clientX - ship.x) * Math.min(1, Math.abs(touch.clientX - ship.x) / 40); dy = Math.sign(touch.clientY - 60 - ship.y) * Math.min(1, Math.abs(touch.clientY - 60 - ship.y) / 40); }
  ship.x = Math.max(16, Math.min(W - 16, ship.x + dx * 340 * dt));
  ship.y = Math.max(16, Math.min(H - 16, ship.y + dy * 340 * dt));

  // engine loop follows movement
  const moving = dx || dy;
  if (moving && !engine) engine = sfx.loop("engine", { volume: 1 });
  if (!moving && engine) { engine.stop(0.25); engine = null; }

  cooldown -= dt; rapid -= dt; ship.inv -= dt;
  if ((keys.Space || touch) && cooldown <= 0) shoot();

  spawn -= dt;
  if (spawn <= 0) { const r = 14 + Math.random() * 26; rocks.push({ x: Math.random() * W, y: -40, r, vy: 80 + Math.random() * 120 + score * 0.4, hp: r > 30 ? 3 : 1 }); spawn = Math.max(0.25, 0.9 - score / 600); }

  shots.forEach(s => s.y -= 700 * dt); shots = shots.filter(s => s.y > -20);
  rocks.forEach(r => r.y += r.vy * dt);
  items.forEach(i => i.y += 90 * dt);

  for (const r of rocks) {
    for (const s of shots) if (!s.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r) {
      s.dead = true; r.hp--;
      if (r.hp <= 0) { r.dead = true; score += r.r > 30 ? 30 : 10; explode(r); }
      else sfx.play("hit", { volume: 0.5, rate: 1.3 });
    }
    if (!r.dead && ship.inv <= 0 && Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 12) {
      r.dead = true; lives--; ship.inv = 1.5; sfx.play("hit"); explode(r);
      if (lives <= 0) return over();
    }
  }
  for (const i of items) if (Math.hypot(ship.x - i.x, ship.y - i.y) < 22) {
    i.dead = true;
    if (i.type === "coin") { score += 25; sfx.play("coin", { vary: 0.03 }); }
    else { rapid = 6; sfx.play("powerUp"); sfx.play("shield", { delay: 0.15, volume: 0.6 }); }
  }
  shots = shots.filter(s => !s.dead); rocks = rocks.filter(r => !r.dead && r.y < H + 50); items = items.filter(i => !i.dead && i.y < H + 20);
}

function over(){
  state = "over"; if (engine) { engine.stop(0.3); engine = null; }
  sfx.play("bigBoom"); sfx.play("gameOver", { delay: 0.9 });
  msg.style.display = "flex"; msg.innerHTML = `<b>Game over</b><div>Score ${score}</div><div>Press any key or tap to play again</div>`;
}

function draw(){
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#ffd34d"; items.forEach(i => { g.fillStyle = i.type === "coin" ? "#ffd34d" : "#59b7ff"; g.beginPath(); g.arc(i.x, i.y, 8, 0, 7); g.fill(); });
  g.fillStyle = "#8b8fa3"; rocks.forEach(r => { g.beginPath(); g.arc(r.x, r.y, r.r, 0, 7); g.fill(); });
  g.fillStyle = "#ff6b6b"; shots.forEach(s => g.fillRect(s.x - 2, s.y - 8, 4, 12));
  if (state === "play" && (ship.inv <= 0 || Math.floor(ship.inv * 10) % 2)) {
    g.fillStyle = rapid > 0 ? "#59b7ff" : "#e8eaf2";
    g.beginPath(); g.moveTo(ship.x, ship.y - 18); g.lineTo(ship.x - 13, ship.y + 12); g.lineTo(ship.x + 13, ship.y + 12); g.closePath(); g.fill();
  }
  hud.textContent = state === "play" ? `Score ${score}   ·   Lives ${"♥".repeat(lives)}${rapid > 0 ? "   ·   RAPID FIRE" : ""}` : "";
}

function frame(t){ const dt = Math.min(0.05, (t - t0) / 1000); t0 = t; if (state === "play") update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
